on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
name: ci
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The first installation step ensures that all of our production
      # dependencies work on the given Node.js version, this helps us find
      # dependencies that don't match our engines field:
      - run: npm install --production --engine-strict --ignore-scripts --no-package-lock
      # Clean up the production install, before installing dev/production:
      - run: rm -rf node_modules
      - run: npm ci
      - run: npm test
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
  build-dist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Build into an empty dist, so a tracked file the build no longer
      # writes shows up as deleted.
      - run: rm -rf dist
      - run: npm run build
      # Fail when the committed bundle differs from a fresh build, so a
      # reviewer can trust dist without reading the generated diff.
      - name: Check that dist matches the build
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"
